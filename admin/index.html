<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>写作后台 · CreFire</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('/assets/css/styles.css');

    var PostPreview = createClass({
      render: function () {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var desc = entry.getIn(['data', 'description']) || '';
        return h('main', { className: 'site-shell', style: { paddingTop: '2rem', paddingBottom: '3rem' } },
          h('article', { className: 'post' },
            h('header', { className: 'post__header' },
              h('h1', { className: 'post__title' }, title),
              desc ? h('p', { className: 'post__subtitle' }, desc) : null
            ),
            h('div', { className: 'prose' }, this.props.widgetFor('body'))
          )
        );
      }
    });

    CMS.registerPreviewTemplate('posts', PostPreview);
    CMS.registerPreviewTemplate('pages', PostPreview);
  </script>
</body>
</html>
