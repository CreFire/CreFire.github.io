backend:
  name: github
  repo: CreFire/CreFire.github.io
  branch: main
  base_url: https://crefire-pages-auth.astroblog.workers.dev

locale: "zh_Hans"
publish_mode: editorial_workflow
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - label: "文章"
    name: "posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    summary: "{{year}}-{{month}}-{{day}} · {{title}}"
    fields:
      - label: "布局"
        name: "layout"
        widget: "hidden"
        default: "post"
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "发布时间"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss"
      - label: "摘要"
        name: "description"
        widget: "string"
        required: false
        hint: "可选，将显示在文章列表与搜索摘要中。"
      - label: "分类"
        name: "category"
        widget: "string"
        required: false
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        hint: "用英文逗号分隔多个标签。"
      - label: "正文"
        name: "body"
        widget: "markdown"
        required: false

  - label: "独立页面"
    name: "pages"
    folder: "pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - label: "布局"
        name: "layout"
        widget: "hidden"
        default: "page"
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "显示在顶部导航"
        name: "menu"
        widget: "boolean"
        default: true
      - label: "自定义路径 (Permalink)"
        name: "permalink"
        widget: "string"
        required: false
        hint: "可选，例如 /notes/ ；留空则按文件名自动生成路径。"
      - label: "页面描述"
        name: "description"
        widget: "string"
        required: false
      - label: "正文"
        name: "body"
        widget: "markdown"
