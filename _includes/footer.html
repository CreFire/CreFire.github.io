<footer class="site-footer">
  <div class="site-footer__inner">
    <span class="site-footer__copy">© {{ site.time | date: "%Y" }} {{ site.title }}</span>
    <div class="site-footer__links">
      {% if site.github_username %}
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      {% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="{{ '/admin/' | relative_url }}">写作</a>
    </div>
  </div>
</footer>

<div class="search-dialog" id="search-dialog" hidden role="dialog" aria-modal="true" aria-label="站内搜索">
  <div class="search-dialog__backdrop" data-search-close></div>
  <div class="search-dialog__panel">
    <div class="search-dialog__input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
      </svg>
      <input type="search" id="search-input" class="search-dialog__input" placeholder="搜索文章标题、标签或正文关键词…" autocomplete="off" spellcheck="false">
      <button type="button" class="search-dialog__esc" data-search-close>Esc</button>
    </div>
    <ul class="search-dialog__results" id="search-results" role="listbox"></ul>
  </div>
</div>

<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
